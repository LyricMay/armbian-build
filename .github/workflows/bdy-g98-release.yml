name: Build and release BDY G98 images

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: bdy-g98-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.release }} minimal
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, trixie, jammy, noble]
    steps:
      - name: Check out Armbian build
        uses: actions/checkout@v4

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build image
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          ./compile.sh build \
            BOARD=bdy-g98 BRANCH=vendor RELEASE="${RELEASE}" \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no EXPERT=yes \
            KERNEL_CONFIGURE=no CPUTHREADS=16 \
            COMPRESS_OUTPUTIMAGE=sha,img

      - name: Collect release assets
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          mkdir -p "release-assets/${RELEASE}"
          find output/images -maxdepth 1 -type f -exec cp -v {} "release-assets/${RELEASE}/" \;
          find . -type f -name rkspi_loader.img -exec cp -v {} "release-assets/${RELEASE}/" \;
          (cd "release-assets/${RELEASE}" && sha256sum * > SHA256SUMS)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdy-g98-${{ matrix.release }}
          if-no-files-found: error
          retention-days: 14
          path: release-assets/${{ matrix.release }}

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Write release notes
        run: |
          printf '%s\n' \
            '# BDY G98 RK3588 Armbian vendor images' \
            '' \
            'Debian Bookworm/Trixie and Ubuntu Jammy/Noble minimal images are provided.' \
            'The boot chain is SPI-NOR -> U-Boot -> NVMe. SPI loader images are included.' \
            'HDMI modes, hotplug, audio, and untested peripherals remain hardware-validation items.' \
            > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
