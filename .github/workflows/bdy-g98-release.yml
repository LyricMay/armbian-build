name: Build BDY G98 ReDroid image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bdy-g98-release.yml"
      - "config/boards/bdy-g98*.csc"
      - "config/bootscripts/boot-bdy-g98.cmd"
      - "config/optional/boards/bdy-g98/**"
      - "patch/kernel/rk35xx-vendor-6.1/**"
      - "patch/u-boot/legacy/u-boot-radxa-rk35xx/**"
  push:
    branches:
      - "bdy-g98-redroid"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bdy-g98-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: BDY G98 ReDroid Debian Trixie minimal
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out Armbian build
        uses: actions/checkout@v4

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build image
        run: |
          ./compile.sh build \
            BOARD=bdy-g98-redroid \
            BRANCH=vendor \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            COMPRESS_OUTPUTIMAGE=sha,img \
            CPUTHREADS=8 \
            EXPERT=yes \
            KERNEL_CONFIGURE=no \
            PREFER_DOCKER=no \
            RELEASE=trixie

      - name: Collect artifacts
        run: |
          asset_dir="release-assets/bdy-g98-redroid-trixie"
          install -d "${asset_dir}"
          find output/images -maxdepth 1 -type f -exec cp -v -- {} "${asset_dir}/" \;

          spi_loader="output/images/rkspi_loader.img"
          if [ ! -s "${spi_loader}" ]; then
            spi_loader="$(find cache/sources/u-boot-worktree -type f \
              -name rkspi_loader.img -print -quit)"
          fi
          test -s "${spi_loader}"
          install -m 0644 "${spi_loader}" "${asset_dir}/rkspi_loader.img"

          cd "${asset_dir}"
          sha256sum -- * > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdy-g98-redroid-trixie
          if-no-files-found: error
          retention-days: 14
          path: release-assets/bdy-g98-redroid-trixie

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Write release notes
        run: |
          printf '%s\n' \
            '# BDY G98 RK3588 ReDroid image' \
            '' \
            'Armbian vendor image for the BDY G98 RK3588 board.' \
            '' \
            '## Image' \
            '' \
            '- Debian 13 (Trixie) minimal ARM64 image.' \
            '- Linux 6.1 vendor kernel and Rockchip U-Boot.' \
            '- ReDroid-oriented kernel and DMA-Heap configuration.' \
            '' \
            '## Boot' \
            '' \
            '- Boot chain: SPI-NOR -> U-Boot -> NVMe.' \
            '- Flash the matching `rkspi_loader.img` to SPI-NOR before first NVMe boot.' \
            '' \
            'SHA256 checksums are provided in `SHA256SUMS`.' \
            > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/**/*
